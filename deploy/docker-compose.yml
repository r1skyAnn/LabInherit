name: labinherit

# Compose v2 syntax. `docker compose` (with a space) is the v2 CLI.
# This file uses the modern `services:` and `name:` top-level keys.

services:
  mysql:
    image: mysql:8.0
    container_name: labinherit-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-labinherit}
      MYSQL_USER: ${MYSQL_USER:-labinherit}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-labinherit_dev}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - 127.0.0.1
        - -u
        - root
        - -p${MYSQL_ROOT_PASSWORD:-rootpass}
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - labinherit-net

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: dev
    container_name: labinherit-backend
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
      - /app/.venv        # container-managed venv; don't clobber
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - labinherit-net

  worker:
    # Email worker that polls email_outbox and sends via SMTP
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: dev
    container_name: labinherit-worker
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
    command: ["python", "-m", "app.tasks.email_worker"]
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - labinherit-net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: labinherit-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE: /api/v1
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - labinherit-net

volumes:
  mysql_data:
    name: labinherit-mysql-data

networks:
  labinherit-net:
    name: labinherit-net
    driver: bridge
